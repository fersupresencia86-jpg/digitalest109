<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sala de Digitales T109</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="eyebrow">T109 · SALA DE DIGITALES</div>
      <h1>Bitácora de servicio social</h1>
      <p class="sub">Entra con tu usuario para registrar tu actividad de la semana.</p>

      <div class="error-box" id="err"></div>

      <form id="loginForm">
        <div class="field">
          <label for="username">Usuario</label>
          <input id="username" name="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn block" type="submit">Entrar</button>
      </form>
    </div>
  </div>
  <script src="/js/login.js"></script>
</body>
</html>
